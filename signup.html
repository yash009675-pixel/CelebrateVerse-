<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Create Account | CelebrateVerse</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="auth-page">

    <div class="auth-glow auth-glow-one"></div>

    <div class="auth-glow auth-glow-two"></div>


    <section class="auth-card">

      <a href="index.html" class="auth-logo">

        Celebrate<span>Verse</span>

      </a>


      <div class="auth-header">

        <span class="section-tag">
          JOIN CELEBRATEVERSE
        </span>

        <h1>
          Create Your
          <span>Universe.</span>
        </h1>

        <p>
          Save your celebrations,
          memories and surprises.
        </p>

      </div>


      <form id="signupForm" class="auth-form">

        <div class="input-group">

          <label>Your Name</label>

          <div class="auth-input">

            <i class="fa-solid fa-user"></i>

            <input
              type="text"
              id="signupName"
              placeholder="Enter your name"
              required>

          </div>

        </div>


        <div class="input-group">

          <label>Email Address</label>

          <div class="auth-input">

            <i class="fa-solid fa-envelope"></i>

            <input
              type="email"
              id="signupEmail"
              placeholder="Enter your email"
              required>

          </div>

        </div>


        <div class="input-group">

          <label>Password</label>

          <div class="auth-input">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="signupPassword"
              placeholder="Create a password"
              minlength="6"
              required>

          </div>

        </div>


        <button
          type="submit"
          class="auth-submit">

          Create Account

          <i class="fa-solid fa-arrow-right"></i>

        </button>

      </form>
<p class="cv-auth-switch"><a href="login.html">Already have an account? Login</a></p>


      <p class="auth-switch">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>


      <p id="authMessage" class="auth-message"></p>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>

</body>

</html>
