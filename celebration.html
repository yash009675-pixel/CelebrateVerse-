<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CelebrateVerse Celebration</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;background:#080812;color:#fff;font-family:DM Sans,system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}.brand{font-weight:700;margin-bottom:20px}.brand span{opacity:.7}.card{min-height:70vh;border-radius:28px;overflow:hidden;padding:20px;box-sizing:border-box;box-shadow:0 30px 90px rgba(0,0,0,.35)}.card>*{position:relative}.empty{text-align:center;padding:20vh 20px}.back{color:#fff} .cv-celebration-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:18px 0 8px}.cv-celebration-actions button{border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 15px;background:rgba(255,255,255,.08);color:inherit;font:600 14px inherit;cursor:pointer}.cv-celebration-actions span{opacity:.75}</style></head><body><div class="wrap"><div class="brand">Celebrate<span>Verse</span></div><main id="celebration" class="card"><div class="empty">Loading celebration…</div></main><div id="cvCelebrationActions" class="cv-celebration-actions" hidden><button id="cvShareCelebration" type="button">🔗 Share Celebration</button><button id="cvReactCelebration" type="button">❤️ <span>Celebrate</span></button><span id="cvReactionCount">0</span></div></div><script src="celebration.js"></script></body></html>
