<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password | CelebrateVerse</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="auth-page"><section class="auth-card"><a href="index.html" class="auth-logo">Celebrate<span>Verse</span></a><div class="auth-header"><span class="section-tag">SECURE ACCOUNT</span><h1>Set a New <span>Password.</span></h1><p>Choose a new password for your CelebrateVerse account.</p></div><form id="resetForm" class="auth-form"><div class="input-group"><label>New Password</label><div class="auth-input"><input id="newPassword" type="password" minlength="6" required placeholder="At least 6 characters"></div></div><div class="input-group"><label>Confirm Password</label><div class="auth-input"><input id="confirmPassword" type="password" minlength="6" required placeholder="Enter it again"></div></div><button type="submit" class="auth-submit">Update Password <span>→</span></button></form><p id="resetMessage" class="auth-message"></p><p class="auth-switch"><a href="login.html">Back to Login</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const f=document.getElementById("resetForm"),m=document.getElementById("resetMessage");f.addEventListener("submit",async e=>{e.preventDefault();const p=document.getElementById("newPassword").value,c=document.getElementById("confirmPassword").value;if(p.length<6)return m.textContent="Password must be at least 6 characters.";if(p!==c)return m.textContent="Passwords do not match.";const {error}=await supabaseClient.auth.updateUser({password:p});if(error){m.textContent="Could not update password: "+error.message;return}m.className="auth-message success";m.textContent="Password updated successfully. Redirecting to login…";setTimeout(()=>location.href="login.html",900)})});</script></body></html>
