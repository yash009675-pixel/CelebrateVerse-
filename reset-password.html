<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | CelebrateVerse</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-page">
<section class="auth-card">
<a href="index.html" class="auth-logo">Celebrate<span>Verse</span></a>
<div class="auth-header">
<span class="section-tag">SECURE ACCOUNT</span>
<h1>Set a New <span>Password.</span></h1>
<p>Use the secure link from your email to choose a new CelebrateVerse password.</p>
</div>

<form id="resetForm" class="auth-form" novalidate>
<div class="input-group">
<label>New Password</label>
<div class="auth-input">
<input id="newPassword" type="password" minlength="6" placeholder="At least 6 characters">
</div>
</div>
<div class="input-group">
<label>Confirm Password</label>
<div class="auth-input">
<input id="confirmPassword" type="password" minlength="6" placeholder="Enter it again">
</div>
</div>
<button id="resetButton" type="submit" class="auth-submit">Update Password <span>→</span></button>
</form>

<p id="resetMessage" class="auth-message"></p>
<p class="auth-switch"><a href="login.html">Back to Login</a></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=20260905-reset"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const form = document.getElementById("resetForm");
  const message = document.getElementById("resetMessage");
  const button = document.getElementById("resetButton");

  const show = (text, success = false) => {
    message.textContent = text;
    message.className = success ? "auth-message success" : "auth-message error";
  };

  if (!window.supabaseClient) {
    show("Authentication service is not available. Please try again.");
    return;
  }

  // Supabase recovery links can establish the session asynchronously from the URL hash.
  let recoverySession = null;
  const readSession = async () => {
    const result = await supabaseClient.auth.getSession();
    recoverySession = result.data?.session || null;
    return recoverySession;
  };

  await readSession();

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" || session) recoverySession = session;
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (!password) return show("Please enter a new password.");
    if (password.length < 6) return show("Password must be at least 6 characters.");
    if (password !== confirm) return show("Passwords do not match.");

    const session = recoverySession || await readSession();
    if (!session?.user) {
      show("This reset link is missing or expired. Request a new password-reset email from Login.");
      return;
    }

    button.disabled = true;
    button.textContent = "Updating...";

    const { error } = await supabaseClient.auth.updateUser({ password });

    button.disabled = false;
    button.innerHTML = 'Update Password <span>→</span>';

    if (error) {
      show("Could not update password: " + error.message);
      return;
    }

    show("Password updated successfully. You can now log in.", true);
    setTimeout(() => { window.location.href = "login.html"; }, 1000);
  });
});
</script>
</body>
</html>
