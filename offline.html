<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Offline | CelebrateVerse</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#0b1020;color:#fff;box-sizing:border-box}
    .card{max-width:480px;text-align:center;padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.05)}
    h1{margin:0 0 12px} p{opacity:.75;line-height:1.6}
    button{margin-top:14px;border:0;border-radius:14px;padding:14px 20px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <div style="font-size:54px">📡</div>
    <h1>You're offline</h1>
    <p>CelebrateVerse needs an internet connection for this page. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </main>
</body>
</html>
