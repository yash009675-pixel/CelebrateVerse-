<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login | CelebrateVerse</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="auth-page">

    <div class="auth-glow auth-glow-one"></div>
    <div class="auth-glow auth-glow-two"></div>


    <section class="auth-card">

      <a href="index.html" class="auth-logo">

        Celebrate<span>Verse</span>

      </a>


      <div class="auth-header">

        <span class="section-tag">
          WELCOME BACK
        </span>

        <h1>
          Continue Your
          <span>Story.</span>
        </h1>

        <p>
          Login to manage your celebrations,
          drafts and memories.
        </p>

      </div>


      <form id="loginForm" class="auth-form">

        <div class="input-group">

          <label>Email Address</label>

          <div class="auth-input">

            <i class="fa-solid fa-envelope"></i>

            <input
              type="email"
              id="loginEmail"
              placeholder="Enter your email"
              required>

          </div>

        </div>


        <div class="input-group">

          <label>Password</label>

          <div class="auth-input">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              required>

          </div>

        </div>


        <button
          type="submit"
          class="auth-submit">

          Login

          <i class="fa-solid fa-arrow-right"></i>

        </button>

      </form>


      <p class="auth-switch">

        Don't have an account?

        <a href="signup.html">
          Create Account
        </a>

      </p>


      <p id="authMessage" class="auth-message"></p>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>

</body>

</html>
