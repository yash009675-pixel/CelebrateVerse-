<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CelebrateVerse Editor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="canva-editor.css"><link rel="stylesheet" href="stable-editor.css"></head><body><header class="navbar"><div class="nav-container"><a href="index.html" class="logo">Celebrate<span>Verse</span></a><a href="index.html">← Home</a></div></header><main class="customizer-page"><div class="customizer-container"><div class="customizer-header"><span class="section-tag">CREATE SOMETHING UNFORGETTABLE</span><h1>Create Your <span>Celebration.</span></h1><p>First add your celebration details, then design it in the editor below.</p></div><form id="celebrationForm"><div class="form-step active"><div class="details-grid"><div class="input-group"><label>Celebrating Person's Name</label><input id="personName" required></div><div class="input-group"><label>Your Name</label><input id="customerName" required></div><div class="input-group"><label>Special Date</label><input id="specialDate" type="date"></div><div class="input-group"><label>Email</label><input id="email" type="email"></div><div class="input-group full-width"><label>Special Message</label><textarea id="message" rows="4"></textarea></div></div></div></form><section class="cv-live-preview-section"><div class="cv-preview-header"><span>LIVE PREVIEW</span><h2>Your Celebration <em>In Real Time</em></h2></div><div class="cv-live-preview"><div class="cv-preview-browser"><div class="cv-browser-bar"><span></span><span></span><span></span></div><div class="cv-preview-content" id="cvPreviewContent"><div class="cv-preview-icon">❤️</div><p class="cv-preview-small">MADE WITH LOVE</p><h1 id="previewRecipientName">Someone Special</h1><p class="cv-preview-message"><span id="previewMessage">Your beautiful message will appear here.</span></p><div class="cv-preview-divider"><span>✦</span></div><p class="cv-preview-from">From <strong id="previewSenderName">Someone Special</strong></p></div></div></div></section></div></main><script src="stable-editor.js"></script><script src="projects-publish.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const p=document.getElementById('personName'),c=document.getElementById('customerName'),m=document.getElementById('message');const sync=()=>{document.getElementById('previewRecipientName').textContent=p.value||'Someone Special';document.getElementById('previewSenderName').textContent=c.value||'Someone Special';document.getElementById('previewMessage').textContent=m.value||'Your beautiful message will appear here.'};[p,c,m].forEach(x=>x.addEventListener('input',sync));sync()})</script></body></html>
