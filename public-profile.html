epeat(3,1fr);gap:8px;margin-bottom:16px}.public-tabs button{padding:12px 6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:inherit;border-radius:12px;font-weight:700}.public-tabs button.active{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.4)}.public-content{min-height:180px}.public-empty{text-align:center;padding:35px 15px;opacity:.72}.public-loading{text-align:center;padding:60px 15px}.public-error{text-align:center;padding:50px 15px}@media(max-width:520px){.public-hero{align-items:flex-start}.public-avatar{width:86px;height:86px;font-size:24px}.public-card{padding:22px 15px}.public-identity h1{font-size:25px}}</style></head><body><main class="public-wrap"><div class="public-shell"><header class="public-top"><a href="index.html">← Home</a><a href="index.html" class="public-brand">Celebrate<span>Verse</span></a></header><section class="public-card cv-profile-card" id="publicProfile"><div class="public-loading">Loading public profile…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="public-profile.js"></script></body></html>
